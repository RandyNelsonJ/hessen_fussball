[project]
name = "hessen-fussball"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RandyNelsonJ", email = "rjbest@umich.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "geopy>=2.5.0",
    "ipykernel>=7.4.0",
    "lxml>=6.1.3",
    "osmnx>=2.1.1",
]

[project.scripts]
hessen-fussball = "hessen_fussball:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
